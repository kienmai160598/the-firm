name: NuvioTv
options:
  bundleIdPrefix: com.kien.movies.tvos
  deploymentTarget:
    tvOS: "17.0"
packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit
    exactVersion: 1.1.0-n9.0.2
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  NuvioTv:
    type: application
    platform: tvOS
    sources:
      - Sources
    dependencies:
      - package: MPVKit
        product: MPVKit-GPL
      - target: NuvioTvTopShelf
    entitlements:
      path: NuvioTv.entitlements
      properties:
        # The app's own group stays first, so keychain items without a group still land there.
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kien.movies.tvos
          - $(AppIdentifierPrefix)com.kien.movies.tvos.shared
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: A phone on your home network sends addon links to Movies.
        TopShelfKeychainGroup: $(AppIdentifierPrefix)com.kien.movies.tvos.shared
        # movies://continue?key=... opens a Continue Watching item from the Top Shelf.
        CFBundleURLTypes:
          - CFBundleURLName: com.kien.movies.tvos
            CFBundleURLSchemes:
              - movies
    settings:
      base:
        PRODUCT_NAME: NuvioTv
        PRODUCT_BUNDLE_IDENTIFIER: com.kien.movies.tvos
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Movies
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../shared/apple-tv-bridge/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - NuvioTvShared
          - "-framework"
          - Security
          - "-framework"
          - SystemConfiguration
          - "-framework"
          - CoreFoundation
          - "-lc++"
    preBuildScripts:
      - name: Build NuvioTvShared framework
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build: OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED=YES"
            exit 0
          fi
          JDK17="/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home"
          if [ -z "$JAVA_HOME" ] && [ -x "$JDK17/bin/java" ]; then
            export JAVA_HOME="$JDK17"
          fi
          if [ -n "$JAVA_HOME" ]; then
            export PATH="$JAVA_HOME/bin:/opt/homebrew/bin:$PATH"
          else
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if [ -z "$GRADLE_OPTS" ]; then
            export GRADLE_OPTS="-Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m"
          fi
          if [ -z "$KOTLIN_DAEMON_JVMARGS" ]; then
            export KOTLIN_DAEMON_JVMARGS="-Xmx8192M"
          fi
          cd "$SRCROOT/../../shared"
          ./gradlew :tvosShared:embedAndSignAppleFrameworkForXcode
  NuvioTvTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - TopShelf
      - path: Sources/TopShelfStore.swift
    entitlements:
      path: TopShelf/NuvioTvTopShelf.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.kien.movies.tvos.shared
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Movies
        TopShelfKeychainGroup: $(AppIdentifierPrefix)com.kien.movies.tvos.shared
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kien.movies.tvos.topshelf
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  NuvioTvTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - Tests
    dependencies:
      - target: NuvioTv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kien.movies.tvos.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NuvioTv.app/NuvioTv"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../../shared/apple-tv-bridge/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
  NuvioTvUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: NuvioTv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kien.movies.tvos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NuvioTv
schemes:
  NuvioTv:
    build:
      targets:
        NuvioTv: all
    run:
      enableGPUValidationMode: disabled
    test:
      targets:
        - NuvioTvTests
        - NuvioTvUITests
