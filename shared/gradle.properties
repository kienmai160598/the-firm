#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M
kotlin.native.jvmArgs=-Xmx16384M
kotlin.mpp.enableCInteropCommonization=true

#Gradle
org.gradle.jvmargs=-Xmx12288M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=2048m
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# AGP 9 changed these R8 defaults; the old Android TV app kept the AGP 8 values until the box
# build was checked on the box. Re-check them with the first box build of the new app (slice A2).
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
